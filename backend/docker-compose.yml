services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  
  pg:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nurtaa0077
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: backend_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"

  web:
    build: .
    container_name: my_running_app
    ports:
      - "8080:8000"
    env_file:
      - fastapi-application/.env
    environment:
      - DB_HOST=pg
    # Сначала выполняем миграцию, затем запускаем Uvicorn/Gunicorn
    command: sh -c "alembic upgrade head && gunicorn main:main_app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000"
    depends_on:
      pg:
        condition: service_healthy

volumes:
  postgres_data: 
  rabbitmq-data: